<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">⚡</div>
      <h1>Job Processing System</h1>
      <p>Sign in to your account</p>
    </div>

    <div class="alert alert-error" *ngIf="error">
      <span>⚠️</span> {{ error }}
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="Enter username"
          autocomplete="username"
          [class.is-invalid]="usernameControl.invalid && usernameControl.touched">
        <span class="error-msg"
          *ngIf="usernameControl.invalid && usernameControl.touched">
          Username must be at least 3 characters.
        </span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Enter password"
            autocomplete="current-password"
            [class.is-invalid]="passwordControl.invalid && passwordControl.touched">
          <button
            type="button"
            class="toggle-password"
            (click)="showPassword = !showPassword">
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
        <span class="error-msg"
          *ngIf="passwordControl.invalid && passwordControl.touched">
          Password must be at least 8 characters.
        </span>
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-block"
        [disabled]="isLoading">
        <span *ngIf="isLoading" class="spinner"></span>
        {{ isLoading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <div class="login-hint">
      <p>Default credentials: <code>admin</code> / <code>Admin@123456</code></p>
    </div>
  </div>
</div>
